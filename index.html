<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>LinguaFlash</title><style>:root{--primary:#6366f1;--secondary:#ec4899;--success:#22c55e;--warning:#f59e0b;--danger:#ef4444;--bg:#f8fafc;--card-bg:#fff;--text:#1e293b;--text-light:#64748b;--border:#e2e8f0}*{margin:0;padding:0;box-sizing:border-box;font-family:Segoe UI,system-ui,sans-serif}body{background:var(--bg);color:var(--text);min-height:100vh}.container{max-width:1200px;margin:0 auto;padding:1rem}.player-card{background:linear-gradient(135deg,var(--primary),var(--secondary));border-radius:16px;padding:1.5rem;color:#fff;aspect-ratio:3/4;max-width:300px;margin:0 auto 2rem;position:relative;overflow:hidden;box-shadow:0 10px 25px -5px rgba(0,0,0,.2)}.player-avatar{width:80px;height:80px;background:rgba(255,255,255,.2);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:2.5rem;margin:0 auto 1rem}.player-name{text-align:center;font-size:1.5rem;font-weight:bold;margin-bottom:.5rem;cursor:pointer;padding:.25rem .5rem;border-radius:8px}.player-name:hover{background:rgba(255,255,255,.1)}.level-info{text-align:center;margin-bottom:1rem}.xp-bar-container{background:rgba(255,255,255,.2);border-radius:10px;height:12px;overflow:hidden}.xp-bar-fill{background:linear-gradient(90deg,#fbbf24,#f59e0b);height:100%;transition:width .5s}.xp-text{text-align:center;font-size:.75rem;margin-top:.25rem;opacity:.9}.player-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:.5rem;margin-top:1rem}.stat-item{background:rgba(255,255,255,.15);padding:.75rem .5rem;border-radius:12px;text-align:center}.stat-value{font-size:1.25rem;font-weight:bold;display:block}.stat-label{font-size:.7rem;opacity:.9;text-transform:uppercase}.nav{display:flex;gap:.5rem;margin-bottom:2rem;flex-wrap:wrap;justify-content:center}.nav-btn{padding:.75rem 1.5rem;border:none;background:var(--card-bg);color:var(--text);border-radius:12px;cursor:pointer;font-weight:600;box-shadow:0 4px 6px -1px rgba(0,0,0,.1)}.nav-btn.active{background:var(--primary);color:#fff}.view{display:none}.view.active{display:block}.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:1rem;margin-bottom:2rem}.stat-card{background:var(--card-bg);padding:1.5rem;border-radius:16px;box-shadow:0 4px 6px -1px rgba(0,0,0,.1);text-align:center}.deck-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:1rem}.deck-card{background:var(--card-bg);padding:1.5rem;border-radius:16px;box-shadow:0 4px 6px -1px rgba(0,0,0,.1)}.deck-header{display:flex;justify-content:space-between;margin-bottom:1rem}.deck-title{font-size:1.25rem;font-weight:bold;color:var(--primary)}.btn-small{padding:.25rem .75rem;border:none;border-radius:8px;cursor:pointer;font-size:.875rem}.btn-edit{background:var(--warning);color:#fff}.btn-delete{background:var(--danger);color:#fff}.btn-primary{background:var(--primary);color:#fff}.btn-success{background:var(--success);color:#fff}.form-group{margin-bottom:1rem}.form-label{display:block;margin-bottom:.5rem;font-weight:600}.form-input,.form-textarea{width:100%;padding:.75rem;border:2px solid var(--border);border-radius:12px}.study-container{max-width:600px;margin:0 auto}.flashcard{background:var(--card-bg);border-radius:20px;padding:2rem;min-height:400px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;cursor:pointer;transition:transform .6s;transform-style:preserve-3d;position:relative}.flashcard.flipped{transform:rotateY(180deg)}.flashcard-front,.flashcard-back{backface-visibility:hidden;width:100%}.flashcard-back{position:absolute;top:0;left:0;height:100%;display:flex;flex-direction:column;justify-content:center;align-items:center;transform:rotateY(180deg);padding:2rem}.card-word{font-size:2.5rem;font-weight:bold;color:var(--primary);margin-bottom:1rem}.card-translation{font-size:2rem;font-weight:bold;color:var(--secondary);margin-bottom:1rem}.grade-buttons{display:flex;gap:1rem;margin-top:2rem;justify-content:center}.grade-btn{padding:1rem 2rem;border:none;border-radius:12px;cursor:pointer;font-weight:bold}.grade-again{background:var(--danger);color:#fff}.grade-good{background:var(--warning);color:#fff}.grade-easy{background:var(--success);color:#fff}.session-complete{text-align:center;padding:2rem}.session-stats{display:grid;grid-template-columns:repeat(2,1fr);gap:1rem;margin:2rem 0;max-width:400px;margin-left:auto;margin-right:auto}.session-stat{background:var(--card-bg);padding:1.5rem;border-radius:16px;box-shadow:0 4px 6px -1px rgba(0,0,0,.1)}.level-up-notification{background:linear-gradient(135deg,#fbbf24,#f59e0b);color:#fff;padding:1.5rem;border-radius:16px;margin-bottom:2rem;animation:pulse 2s infinite}@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.02)}}#confetti-canvas{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:1000}.modal-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.5);display:none;justify-content:center;align-items:center;z-index:100}.modal-overlay.active{display:flex}.modal{background:var(--card-bg);padding:2rem;border-radius:16px;max-width:500px;width:90%}.progress-bar{background:var(--border);height:8px;border-radius:4px;overflow:hidden;margin-bottom:1rem}.progress-fill{background:var(--primary);height:100%;transition:width .3s}@media(max-width:768px){.player-card{max-width:100%}.grade-buttons{flex-direction:column}.grade-btn{width:100%}}</style></head>
<body><canvas id="confetti-canvas"></canvas><div class="container"><div class="player-card"><div class="player-avatar" id="playerAvatar">🎓</div><div class="player-name" id="playerNameDisplay" onclick="editPlayerName()">Learner</div><div class="level-info"><div>Level <span id="playerLevel">1</span></div><div class="xp-bar-container"><div class="xp-bar-fill" id="xpBarFill" style="width:0%"></div></div><div class="xp-text"><span id="currentXP">0</span>/<span id="xpToNext">100</span> XP</div></div><div class="player-stats"><div class="stat-item"><span class="stat-value" id="statMastered">0</span><span class="stat-label">Mastered</span></div><div class="stat-item"><span class="stat-value" id="statStreak">0</span><span class="stat-label">Streak</span></div><div class="stat-item"><span class="stat-value" id="statReviews">0</span><span class="stat-label">Reviews</span></div></div></div><nav class="nav"><button class="nav-btn active" onclick="showView('dashboard')">Dashboard</button><button class="nav-btn" onclick="showView('decks')">Decks</button><button class="nav-btn" onclick="startStudySession()">Study</button></nav><div id="dashboard" class="view active"><div class="stats-grid"><div class="stat-card"><div style="font-size:2rem">📚</div><div class="stat-value" style="color:var(--primary)" id="dueToday">0</div><div class="stat-label">Cards Due</div></div><div class="stat-card"><div style="font-size:2rem">✅</div><div class="stat-value" style="color:var(--primary)" id="totalReviewed">0</div><div class="stat-label">Total Reviewed</div></div><div class="stat-card"><div style="font-size:2rem">🔥</div><div class="stat-value" style="color:var(--primary)" id="currentStreak">0</div><div class="stat-label">Day Streak</div></div><div class="stat-card"><div style="font-size:2rem">🎯</div><div class="stat-value" style="color:var(--primary)" id="totalCards">0</div><div class="stat-label">Total Cards</div></div></div></div><div id="decks" class="view"><button class="btn-primary" onclick="showModal('deckModal')" style="margin-bottom:1rem">+ New Deck</button><div class="deck-list" id="deckList"></div><div style="margin-top:2rem;display:flex;gap:1rem;flex-wrap:wrap"><button class="btn-primary" onclick="exportData()">Export</button><label class="btn-primary" style="cursor:pointer">Import<input type="file" accept=".json" onchange="importData(event)" style="display:none"></label></div></div><div id="study" class="view"><div class="study-container"><div class="progress-bar"><div class="progress-fill" id="studyProgress" style="width:0%"></div></div><div style="text-align:center;margin-bottom:1rem">Card <span id="currentCardNum">0</span>/<span id="totalCardsNum">0</span></div><div class="flashcard" id="flashcard" onclick="flipCard()"><div class="flashcard-front"><div class="card-word" id="cardFront">Word</div><div style="position:absolute;bottom:1rem;color:var(--text-light)">Click to flip</div></div><div class="flashcard-back"><div class="card-translation" id="cardBack">Translation</div><div id="cardExample" style="font-style:italic;color:var(--text-light);margin:1rem 0;padding:1rem;background:var(--bg);border-radius:12px;width:100%"></div></div></div><div class="grade-buttons" id="gradeButtons" style="display:none"><button class="grade-btn grade-again" onclick="gradeCard('again')">Again</button><button class="grade-btn grade-good" onclick="gradeCard('good')">Good</button><button class="grade-btn grade-easy" onclick="gradeCard('easy')">Easy</button></div></div></div><div id="sessionComplete" class="view"><div class="session-complete"><div id="levelUpNotification" class="level-up-notification" style="display:none">🎉 Level Up! Now level <span id="newLevel">2</span>!</div><h2>Session Complete! 🎊</h2><div class="session-stats"><div class="session-stat"><div class="stat-value" style="color:var(--primary)" id="sessionReviewed">0</div><div class="stat-label">Cards Reviewed</div></div><div class="session-stat"><div class="stat-value" style="color:var(--primary)" id="sessionAccuracy">0%</div><div class="stat-label">Accuracy</div></div><div class="session-stat"><div class="stat-value" style="color:var(--primary)" id="sessionTime">0:00</div><div class="stat-label">Time Spent</div></div><div class="session-stat"><div class="stat-value" style="color:var(--primary)" id="sessionXP">+0</div><div class="stat-label">XP Earned</div></div></div><button class="btn-primary" onclick="showView('dashboard')" style="padding:1rem 2rem;font-size:1.1rem">Back to Dashboard</button></div></div></div><div class="modal-overlay" id="deckModal"><div class="modal"><h3 style="margin-bottom:1.5rem" id="deckModalTitle">New Deck</h3><form id="deckForm" onsubmit="saveDeck(event)"><input type="hidden" id="deckId"><div class="form-group"><label class="form-label">Deck Name</label><input type="text" class="form-input" id="deckName" required></div><div class="form-group"><label class="form-label">Description</label><textarea class="form-textarea" id="deckDescription"></textarea></div><button type="submit" class="btn-primary" style="width:100%;padding:.75rem">Save</button></form></div></div><div class="modal-overlay" id="cardModal"><div class="modal"><h3 style="margin-bottom:1.5rem" id="cardModalTitle">New Card</h3><form id="cardForm" onsubmit="saveCard(event)"><input type="hidden" id="cardId"><input type="hidden" id="cardDeckId"><div class="form-group"><label class="form-label">Front</label><input type="text" class="form-input" id="cardFrontInput" required></div><div class="form-group"><label class="form-label">Back</label><input type="text" class="form-input" id="cardBackInput" required></div><div class="form-group"><label class="form-label">Example</label><textarea class="form-textarea" id="cardExampleInput"></textarea></div><button type="submit" class="btn-primary" style="width:100%;padding:.75rem">Save</button></form></div></div>
<script src="script.js"></script></body></html>
